# Dependabot nativo atualiza as actions pinadas e as dependencias do projeto,
# sem exigir configuracao adicional de aplicativo. Ele tambem atualiza o SHA
# pinado da action junto com o comentario da versao ao lado — exatamente como
# as actions estao fixadas aqui.
#
# O `cooldown` repete em cada ecossistema de proposito: e por entrada, nao
# global. Ele segura uma versao recem-publicada antes de propo-la, porque
# pacote malicioso costuma ser despublicado em horas — sem a carencia, o bot
# abriria o PR com a versao comprometida antes de alguem notar.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Um PR por grupo em vez de um por pacote: em repositorio pessoal a
      # revisao e o gargalo, nao a quantidade de atualizacao disponivel.
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
