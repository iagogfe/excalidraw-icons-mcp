# Publicacao no npm, disparada por release ou manualmente.
#
# O nome do pacote e a versao sao lidos do package.json, nunca escritos a mao
# aqui. Antes o guard consultava `mcp-excalidraw-server`, que e outro pacote
# (publicado em 1.1.0 por outra pessoa) e nao este — o resultado era um guard
# que nao guardava nada, e que passaria a pular a publicacao em silencio no dia
# em que aquele pacote chegasse a mesma versao deste.

name: Publicar no npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'dist-tag do npm (latest, beta, next)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  gates:
    name: Gates de CI e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Aguardar CI e segurança do mesmo commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/await-gates.sh

  publicar:
    name: Publicar no registro do npm
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # anexa o tarball na release
      id-token: write # procedencia do npm (npm publish --provenance)
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build

      - name: Conferir os artefatos de build
        run: |
          for alvo in dist/index.js dist/server.js dist/frontend; do
            if [ ! -e "$alvo" ]; then
              echo "::error::build nao gerou $alvo"
              exit 1
            fi
          done

      - name: Ler nome e versao do package.json
        id: pkg
        run: |
          set -euo pipefail
          {
            echo "nome=$(node -p "require('./package.json').name")"
            echo "versao=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

      - name: Validar tag da release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSAO: ${{ steps.pkg.outputs.versao }}
        run: |
          if [ "$TAG" != "v$VERSAO" ]; then
            echo "::error::tag $TAG não corresponde à versão $VERSAO do package.json"
            exit 1
          fi

      - name: Validar credencial do npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN não está configurado nos secrets do repositório"
            exit 1
          fi
          npm whoami

      - name: Verificar se a versao ja existe no npm
        id: existe
        env:
          NOME: ${{ steps.pkg.outputs.nome }}
          VERSAO: ${{ steps.pkg.outputs.versao }}
        run: |
          # `npm view` sai 1 tanto quando o pacote nao existe quanto quando a
          # versao nao existe. Os dois casos significam "pode publicar".
          if npm view "$NOME@$VERSAO" version > /dev/null 2>&1; then
            echo "valor=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$NOME@$VERSAO ja esta publicado; a publicacao sera pulada"
          else
            echo "valor=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        id: publicar
        if: steps.existe.outputs.valor == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: npm publish --tag "$DIST_TAG" --provenance --access public

      - name: Anexar o tarball na release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          NOME: ${{ steps.pkg.outputs.nome }}
          VERSAO: ${{ steps.pkg.outputs.versao }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          arquivo="${NOME}-${VERSAO}.tar.gz"
          tar -czf "$arquivo" dist/
          gh release upload "$TAG" "$arquivo" --repo "$REPO"

      - name: Resumo
        if: always()
        env:
          NOME: ${{ steps.pkg.outputs.nome }}
          VERSAO: ${{ steps.pkg.outputs.versao }}
          PULOU: ${{ steps.existe.outputs.valor }}
          PUBLICOU: ${{ steps.publicar.outcome }}
        run: |
          if [ "$PULOU" = "true" ]; then
            echo "Publicacao pulada: $NOME@$VERSAO ja existe." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLICOU" = "success" ]; then
            echo "Publicado: https://www.npmjs.com/package/$NOME/v/$VERSAO" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publicação não concluída: $NOME@$VERSAO. Consulte o passo que falhou." >> "$GITHUB_STEP_SUMMARY"
          fi
