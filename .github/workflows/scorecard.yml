# OpenSSF Scorecard: nota publica de praticas de seguranca do repositorio.
#
# So funciona em repositorio publico, entao e uma das poucas coisas que este
# projeto tem e os repositorios privados nao. Avalia pinagem de dependencia,
# permissao de token, branch protection, revisao de codigo e afins — e publica
# o resultado na aba Security, com badge opcional no README.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analise:
    name: Analise do Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # publica o SARIF na aba Security
      id-token: write # assina o resultado para o badge publico
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Torna a nota consultavel publicamente pela API do OpenSSF, que e o
          # que alimenta o badge.
          publish_results: true
      - uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          sarif_file: scorecard.sarif
