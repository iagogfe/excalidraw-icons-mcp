# Build, type-check e gate de estilo.
#
# Este repositorio e publico, entao a pipeline e autocontida: um repositorio
# publico nao consegue chamar reusable workflow de repositorio privado, o que
# descarta reaproveitar `iagogfe/workflows` aqui.
#
# Actions de terceiros pinadas por SHA completo — tag e mutavel, e foi o vetor
# dos ataques tj-actions (mar/2025) e trivy-action (mar/2026). O Dependabot
# atualiza os SHAs e o comentario da versao junto.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` do package.json exige >= 20, e o Node 18 saiu do suporte em
        # abril/2025 — testar nele dava um verde que nao valia nada.
        node: ['20', '22', '24']
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build

      - name: Conferir os artefatos de build
        # O `files` do package.json publica `dist/`, entao um build que gera
        # menos que isto quebraria o pacote sem quebrar o build.
        run: |
          for alvo in dist/index.js dist/server.js dist/frontend; do
            if [ ! -e "$alvo" ]; then
              echo "::error::build nao gerou $alvo"
              exit 1
            fi
          done
          echo "artefatos presentes"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '22'
        with:
          name: dist
          path: dist/
          retention-days: 7

  estilo:
    name: Gate de estilo
    # So em PR: o "antes" da comparacao e a branch base. Em push nao ha base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comenta a comparacao no PR
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # o worktree da base precisa do historico
      # PR vindo de fork recebe token somente-leitura, entao o comentario falha
      # e vira aviso. O veredito continua valendo: a tabela vai para o resumo do
      # job e o passo reprova igual.
      - uses: ./.github/actions/gate-estilo
        with:
          token: ${{ github.token }}
          cli-dirs: 'scripts bin cli measure'
